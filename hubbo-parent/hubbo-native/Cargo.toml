[package]
name = "hubbo-native"
version = "0.1.0"
edition = "2024"
description = "hubbo与系统底层API交互的依赖库"
authors = ["张晓华", "yunjiang"]
license = "GPL-2"
readme = "../../README.md"


[lib]
name = "hubbo_native_dynamic_lib"
crate-type = ["cdylib"]

[dependencies]
aws-lc-rs = { version = "1.15.4", features = ["default", "unstable"] }
hex = "0.4.3"
hex-simd = "0.8.0"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
git2 = "0.20.3"
anyhow = "1.0.100"
chrono = "0.4.42"
#gitoxide = "0.49.0"
once_cell = "1.21.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
wasm-bindgen = "0.2.108"



[profile.dev]
opt-level = 2
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"


#[target.x86_64-pc-windows-msvc]
#linker = "x86_64-w64-mingw32-gcc"

[target.x86_64-unknown-linux-gnu]
linker = "gcc"

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "linker=rust-lld"]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.aarch64-apple-darwin]
linker = "clang"

