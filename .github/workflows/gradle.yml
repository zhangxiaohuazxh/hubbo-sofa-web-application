name: Java CI with Gradle

on:
  push:
    branches: ["feature-system-base-20260124"]
  pull_request:
    branches: ["feature-system-base-20260124"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: hubbo-parent
        # 不指定 gradle-version，让 wrapper 自行下载 gradle-wrapper.properties 中指定的版本
        # setup-gradle 仅负责缓存加速，不干预 wrapper 的版本选择

      - name: Grant execute permission to gradlew
        run: chmod +x ./hubbo-parent/gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build --no-daemon --stacktrace
        working-directory: hubbo-parent
        # --no-daemon: CI 环境无需守护进程，避免进程残留
        # --stacktrace: 失败时输出完整堆栈，便于排查

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: devops-jar
          path: module/devops/build/libs/*.jar
          retention-days: 7

