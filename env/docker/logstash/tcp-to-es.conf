input {
  tcp {
    port => 5000            # 监听端口，确保防火墙开放此端口
    host => "0.0.0.0"       # 监听所有网卡接口
    codec => json           # 如果发送的是 JSON 格式；如果是纯文本，改为 "plain" 或去掉此行
    # codec => plain        # 纯文本模式示例
  }
}

filter {
  # 可选：添加时间戳或处理字段
  # 如果发送的是纯文本，通常在这里使用 grok 进行解析
  if [codec] == "plain" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:log_time} %{LOGLEVEL:level} %{GREEDYDATA:msg}" }
    }
    date {
      match => [ "log_time", "ISO8601" ]
      target => "@timestamp"
    }
  }
  
  # 添加自定义标签，方便在 ES 中区分来源
  mutate {
    add_tag => ["tcp_input"]
    add_field => { "source_type" => "app_tcp_log" }
  }
}

output {
  elasticsearch {
    hosts => ["http://127.0.0.1:9200"]  # 替换为你的 ES 地址
    index => "hetu-logs" # 索引名称格式
    
    # 如果 ES 开启了账号密码认证，取消下面注释并填写
    # user => "elastic"
    # password => "your_password"
    
    # 优化性能参数（可选）
    # flush_size => 2000
    # idle_flush_time => 5
  }
  
  # 调试用：在控制台打印接收到的日志（生产环境建议注释掉，以免刷屏）
  # stdout { codec => rubydebug }
}
